<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900;1000&family=Archivo+Black&family=Archivo:ital,wght@1,800&display=block" rel="stylesheet">
<style>
:root{--o:#f26a1f;--o2:#ff8a3d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Cairo,sans-serif;background:radial-gradient(ellipse 90% 70% at 50% 45%,#2a2a2a 0%,#141414 55%,#0a0a0a 100%);position:relative;color:#fff}
.frame{position:absolute;inset:22px;border:4px solid var(--o);border-radius:44px;box-shadow:0 0 22px rgba(242,106,31,.55),inset 0 0 22px rgba(242,106,31,.25)}
.corner{position:absolute;top:0;left:0;width:260px;height:260px;background:linear-gradient(135deg,var(--o2),var(--o) 40%,transparent 41%);opacity:.95}
.corner2{position:absolute;bottom:0;right:0;width:200px;height:200px;background:linear-gradient(315deg,var(--o2),var(--o) 38%,transparent 39%);opacity:.9}
.logo{position:absolute;top:48px;left:50%;transform:translateX(-50%);width:300px}
.dots{position:absolute;top:150px;left:50%;transform:translateX(-50%);display:flex;gap:10px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--o)}
.row1{position:absolute;top:70px;left:70px;right:70px;height:120px;display:flex;align-items:center;justify-content:space-between;direction:ltr}
.brand{font-family:'Archivo Black';font-size:52px;letter-spacing:8px;color:#fff}
.sl{width:6px;height:96px;background:var(--o);transform:skewX(-18deg);border-radius:3px}
.model{text-align:center;line-height:1}
.model .a{font-family:'Archivo';font-style:italic;font-weight:800;font-size:82px;background:linear-gradient(180deg,#fff,#cfcfcf);-webkit-background-clip:text;color:transparent}
.model .b{font-family:'Archivo Black';font-size:26px;letter-spacing:12px;color:#ddd;margin-top:6px}
.sale{background:linear-gradient(180deg,var(--o2),var(--o) 60%,#d6560f);border-radius:22px;transform:skewX(-12deg);padding:0 40px 14px;box-shadow:0 8px 24px rgba(242,106,31,.55)}
.sale span{display:block;transform:skewX(12deg);font-weight:1000;font-size:64px;color:#fff;line-height:1.3}
.photo{position:absolute;left:0;right:0;top:200px;height:770px;background:url('car_fade.png') center 52%/1080px auto no-repeat}
.boxes{position:absolute;top:975px;left:62px;right:62px;display:flex;gap:16px}
.bx{flex:1;height:110px;flex-direction:row!important;gap:10px!important;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:3px solid var(--o);box-shadow:0 0 16px rgba(242,106,31,.45),inset 0 0 14px rgba(242,106,31,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bx svg{width:44px;height:44px;flex:none}
.bx .t{font-weight:1000;font-size:26px;line-height:1.12;text-align:center}
.bx .t .s{font-family:'Archivo';font-style:italic;font-weight:800;font-size:24px}
.bottom{position:absolute;top:1125px;left:62px;right:62px;height:130px;display:flex;align-items:center;gap:30px;direction:ltr}
.ph{flex:1;height:104px;border-radius:60px;border:3px solid var(--o);background:rgba(0,0,0,.45);box-shadow:0 0 16px rgba(242,106,31,.4);display:flex;align-items:center;padding-left:12px;gap:18px}
.ph .ic{width:80px;height:80px;border-radius:50%;background:linear-gradient(180deg,var(--o2),var(--o));display:flex;align-items:center;justify-content:center}
.ph .n{font-family:'Archivo';font-style:italic;font-weight:800;font-size:54px}
.dv{width:4px;height:110px;background:linear-gradient(180deg,transparent,var(--o),transparent)}
.pr{position:relative;flex:1;height:104px;border-radius:60px;border:3px solid var(--o);background:rgba(0,0,0,.45);box-shadow:0 0 16px rgba(242,106,31,.4);display:flex;align-items:center;justify-content:center;gap:14px}
.pr .tab{position:absolute;top:-40px;left:50%;transform:translateX(-50%) skewX(-12deg);background:linear-gradient(180deg,var(--o2),var(--o));padding:0 30px 6px;border-radius:12px;font-weight:1000;font-size:34px;color:#0d0d0d;direction:rtl}
.pr .n{font-family:'Archivo';font-style:italic;font-weight:800;font-size:62px}
.pr .c{font-family:'Archivo Black';font-size:40px;color:var(--o);margin-top:14px}
.line{position:absolute;bottom:58px;left:120px;right:240px;height:4px;background:linear-gradient(90deg,transparent,var(--o),transparent)}

.brand2{display:flex;flex-direction:column;align-items:center;gap:6px}
.brand2 .wm{font-family:'Archivo Black';font-size:30px;letter-spacing:10px;color:#fff}
</style></head><body>
<div class="corner"></div><div class="corner2"></div><div class="frame"></div>

<div class="row1"><div class="brand2"><svg viewBox="0 0 200 130" width="160" height="104"><defs><clipPath id="ec"><ellipse cx="100" cy="65" rx="88" ry="55"/></clipPath><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bdbdbd"/></linearGradient></defs><ellipse cx="100" cy="65" rx="91" ry="58" fill="none" stroke="url(#cg)" stroke-width="8"/><g clip-path="url(#ec)" fill="url(#cg)"><path d="M112 4 L124 4 L76 94 L190 94 L190 104 L60 104 Z"/></g></svg><div class="wm">LEXUS</div></div><div class="sl"></div><div class="model"><div class="a">UX 200</div><div class="b">F SPORT</div></div><div class="sale"><span>للبيع</span></div></div>
<div class="photo"></div>
<div class="boxes">
 <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6h22l12 12v40H18z"/><path d="M40 6v12h12"/><path d="M25 32h14M25 42h10"/><path d="M38 50l4 4 8-9"/></svg><div class="t">شرط<br>الفحص</div></div>
 <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="12"/><path d="M33 33l20 20M45 45l6-6M51 51l4-4"/></svg><div class="t">سيرفس<br>الوكالة</div></div>
 <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linecap="round"><path d="M10 46a24 24 0 1 1 44 0"/><path d="M32 40 44 24"/><circle cx="32" cy="42" r="4" fill="#f26a1f"/></svg><div class="t">العداد<br><span class="s">92</span> الف كم</div></div>
 <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linejoin="round"><rect x="6" y="12" width="52" height="46" rx="6"/><path d="M6 24h52M18 6v12M46 6v12"/><g fill="#f26a1f" stroke="none"><rect x="14" y="31" width="8" height="7"/><rect x="28" y="31" width="8" height="7"/><rect x="42" y="31" width="8" height="7"/><rect x="14" y="44" width="8" height="7"/><rect x="28" y="44" width="8" height="7"/></g></svg><div class="t">موديل<br><span class="s">2019</span></div></div>
</div>
<div class="bottom">
 <div class="ph"><div class="ic"><svg viewBox="0 0 24 24" width="50" height="50" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div><div class="n">66653231</div></div>
 <div class="dv"></div>
 <div class="pr"><div class="tab">السعر</div><span class="n">6,350</span><span class="c">K.D</span></div>
</div>
<div class="line"></div>
</body></html>
