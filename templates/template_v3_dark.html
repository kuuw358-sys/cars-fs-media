<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900;1000&family=Archivo:ital,wght@1,800&family=Archivo+Black&display=block" rel="stylesheet">
<style>
:root{--o:#f26a1f;--o2:#ff9a4a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Cairo;background:radial-gradient(ellipse 100% 80% at 50% 40%,#3a3a3a 0%,#1c1c1c 55%,#0c0c0c 100%);color:#fff;position:relative}
.pw{position:absolute;left:0;right:0;top:175px;height:480px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 80%,transparent 100%)}
.photo{position:absolute;top:0;bottom:0;left:100px;right:100px;background:url('car_v4c.jpg') center 62%/880px auto no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
.ttl{position:absolute;top:58px;left:70px;direction:ltr}
.ttl .a{font-family:'Archivo';font-style:italic;font-weight:800;font-size:76px;line-height:1;background:linear-gradient(180deg,#fff,#d6d6d6);-webkit-background-clip:text;color:transparent}
.ttl .b{font-family:'Archivo Black';font-size:26px;letter-spacing:13px;color:#e6e6e6;margin-top:12px}
.ttl .u{position:absolute;left:-20px;bottom:-26px;width:460px;height:3px;background:linear-gradient(90deg,transparent,var(--o) 30%,var(--o2) 60%,transparent);box-shadow:0 0 12px var(--o)}
.ttl .c{position:absolute;left:-28px;top:-20px;width:120px;height:60px;border-top:3px solid var(--o);border-left:3px solid var(--o);border-radius:22px 0 0 0;box-shadow:-2px -2px 10px rgba(242,106,31,.5)}
.sale{position:absolute;top:58px;right:60px;width:300px;height:120px;background:linear-gradient(180deg,var(--o2),var(--o) 55%,#d4520c);border-radius:24px;transform:skewX(-14deg);box-shadow:0 12px 30px rgba(242,106,31,.5),inset 0 2px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.sale span{transform:skewX(14deg);font-weight:1000;font-size:76px;margin-top:-16px}
.panel{position:absolute;top:640px;left:70px;right:70px;height:200px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:2px solid rgba(242,106,31,.75);box-shadow:0 0 22px rgba(242,106,31,.35),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(10px);display:flex}
.panel .cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.panel .cell+.cell::before{content:'';position:absolute;right:0;top:30px;bottom:30px;width:2px;background:linear-gradient(180deg,transparent,var(--o),transparent)}
.cell svg{width:64px;height:64px;margin-bottom:6px;filter:drop-shadow(0 0 6px rgba(242,106,31,.5))}
.cell .t{font-weight:900;font-size:36px;line-height:1.15;text-align:center}
.cell .s{font-family:'Archivo';font-style:italic;font-weight:800;font-size:34px}
.bot{position:absolute;top:900px;left:70px;right:70px;height:120px;display:flex;align-items:center;gap:28px;direction:ltr}
.ph{flex:1;height:110px;border-radius:56px;border:2px solid rgba(255,255,255,.35);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25));display:flex;align-items:center;gap:22px;padding-left:12px}
.ph .ic{width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,var(--o2),var(--o));display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(242,106,31,.6)}
.ph .n{font-family:'Archivo';font-style:italic;font-weight:800;font-size:56px}
.dv{width:2px;height:90px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.5),transparent)}
.pr{position:relative;flex:1;height:110px;border-radius:30px;transform:skewX(-10deg);background:linear-gradient(180deg,var(--o2),var(--o) 55%,#d4520c);box-shadow:0 12px 28px rgba(242,106,31,.45),inset 0 2px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:10px}
.pr>*{transform:skewX(10deg)}
.pr .n{font-family:'Archivo';font-style:italic;font-weight:800;font-size:62px}
.pr .c{font-family:'Archivo';font-style:italic;font-weight:800;font-size:38px;margin-top:12px}
.pr .tab{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--o2),var(--o));border-radius:12px;padding:0 30px 4px;font-weight:1000;font-size:30px;direction:rtl;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style></head><body>
<div class="pw"><div class="photo"></div></div>
<div class="ttl"><div class="c"></div><div class="a">Lexus UX 200</div><div class="b">F SPORT</div><div class="u"></div></div>
<div class="sale"><span>للبيع</span></div>
<div class="panel">
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6h22l12 12v40H18z"/><path d="M40 6v12h12"/><path d="M25 32h14M25 42h10"/><path d="M38 50l4 4 8-9"/></svg><div class="t">شرط<br>الفحص</div></div>
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="12"/><path d="M33 33l20 20M45 45l6-6M51 51l4-4"/></svg><div class="t">سيرفس<br>الوكالة</div></div>
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linecap="round"><path d="M10 46a24 24 0 1 1 44 0"/><path d="M32 40 44 24"/><circle cx="32" cy="42" r="4" fill="#f26a1f"/></svg><div class="t">العداد<br><span class="s">92</span> الف كم</div></div>
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4.5" stroke-linejoin="round"><rect x="6" y="12" width="52" height="46" rx="6"/><path d="M6 24h52M18 6v12M46 6v12"/><g fill="#f26a1f" stroke="none"><rect x="14" y="31" width="8" height="7"/><rect x="28" y="31" width="8" height="7"/><rect x="42" y="31" width="8" height="7"/><rect x="14" y="44" width="8" height="7"/><rect x="28" y="44" width="8" height="7"/></g></svg><div class="t">موديل<br><span class="s">2019</span></div></div>
</div>
<div class="bot">
 <div class="ph"><div class="ic"><svg viewBox="0 0 24 24" width="46" height="46" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div><div class="n">66653231</div></div>
 <div class="dv"></div>
 <div class="pr"><div class="tab">السعر</div><span class="n">6,350</span><span class="c">K.D</span></div>
</div>
</body></html>
