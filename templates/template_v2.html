<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900;1000&family=Archivo+Black&display=block" rel="stylesheet">
<style>
  :root { --o:#f26a1f; --k:#0d0d0d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  body { font-family:'Cairo',sans-serif; position:relative; background:#111; }
  .lat { font-family:'Archivo Black',sans-serif; }
  .blur { position:absolute; inset:-60px; background:url('car_fs.jpg') center 30%/cover; filter:blur(28px) brightness(.55); }
  .photo { position:absolute; left:0; top:215px; width:1080px; height:800px; background:url('car_fs.jpg') center 55%/contain no-repeat; -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 60px, #000 88%, transparent 100%); }
  .topshade { position:absolute; left:0; right:0; top:0; height:250px; background:linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.3) 60%, rgba(0,0,0,0)); }
  .botfade { position:absolute; left:0; right:0; top:985px; bottom:0; background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.75) 30%, #fff 55%); }
  .swoosh { position:absolute; height:30px; background:var(--o); border-radius:30px; }
  .logo { position:absolute; top:30px; left:36px; width:330px; filter:drop-shadow(0 2px 8px rgba(0,0,0,.55)); }
  .sale { position:absolute; top:30px; right:40px; background:var(--k); border:5px solid var(--o); border-radius:30px; padding:0 40px 12px; transform:rotate(-3deg); color:#fff; font-weight:1000; font-size:66px; line-height:1.15; box-shadow:0 8px 20px rgba(0,0,0,.4); }
  .name { position:absolute; top:132px; right:40px; white-space:nowrap; background:#fff; color:var(--k); border-radius:34px; padding:0 30px 8px; font-weight:1000; font-size:42px; line-height:1.3; box-shadow:0 8px 20px rgba(0,0,0,.35); border:4px solid var(--o); }
  .sub { position:absolute; top:282px; left:50%; transform:translateX(-50%); white-space:nowrap; background:var(--o); color:var(--k); border-radius:40px;
    padding:0 40px 10px; font-weight:1000; font-size:44px; line-height:1.3; box-shadow:0 8px 20px rgba(0,0,0,.3); }
  .boxes { position:absolute; top:1030px; left:40px; right:40px; display:flex; gap:20px; }
  .bx { flex:1; height:150px; flex-direction:row !important; gap:10px; background:#fff; border:6px solid var(--o); border-radius:32px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 12px 26px rgba(0,0,0,.18); }
  .bx svg { width:52px; height:52px; margin-bottom:0; flex:none; }
  .bx .t { font-weight:1000; font-size:30px; line-height:1.12; text-align:center; color:var(--k); }
  .row { position:absolute; top:1218px; left:40px; right:40px; height:110px; display:flex; align-items:center; gap:22px; }
  .price { position:relative; flex:1.05; height:110px; background:var(--k); border:6px solid var(--o); border-radius:36px; display:flex; align-items:center; justify-content:center; gap:14px; direction:ltr; }
  .price .n { font-family:'Archivo Black'; font-size:68px; color:#fff; line-height:1; }
  .price .c { font-family:'Archivo Black'; font-size:44px; color:var(--o); margin-top:22px; }
  .price .tab { position:absolute; top:-46px; right:40px; background:var(--o); color:var(--k); font-weight:1000; font-size:38px; padding:0 30px 8px; border-radius:18px 18px 0 0; line-height:1.3; direction:rtl; }
  .sep { width:4px; height:90px; background:var(--k); border-radius:2px; }
  .phone { flex:1; height:110px; background:var(--k); border:6px solid var(--o); border-radius:70px; display:flex; align-items:center; direction:ltr; padding-left:10px; gap:12px; }
  .phone .ic { width:84px; height:84px; border-radius:50%; background:var(--o); display:flex; align-items:center; justify-content:center; flex:none; }
  .phone .n { font-family:'Archivo Black'; font-size:50px; color:#fff; flex:1; text-align:center; }
</style>
</head>
<body>
  <div class="blur"></div>
  <div class="photo"></div>
  <div class="topshade"></div>
  <div class="botfade"></div>
  <div class="swoosh" style="width:700px; left:-120px; bottom:-8px; transform:rotate(-4deg)"></div>
  <div class="swoosh" style="width:500px; right:-140px; bottom:10px; transform:rotate(-4deg); background:#0d0d0d; height:16px"></div>

  <img class="logo" src="logo_new_white.png">
  <div class="sale">للبيـع</div>
  <div class="name">وانيت فورد <span class="lat" style="font-size:36px">F150</span></div>

  <div class="boxes">
    <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6h22l12 12v40H18z"/><path d="M40 6v12h12"/><path d="M25 30h6M25 40h6M25 50h6"/><circle cx="44" cy="44" r="8"/><path d="M50 50l7 7"/><path d="M34 30l2 2 4-4"/></svg><div class="t">شرط<br>الفحص</div></div>
    <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="20" y="30" width="22" height="28" rx="4"/><path d="M26 30v-8h10v8M31 22v-8h14l6-6M45 14h10"/><path d="M8 10l4 2M6 18h5M8 26l4-2"/></svg><div class="t">صبغ<br>الوكالة</div></div>
    <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="5" stroke-linecap="round"><path d="M10 46a24 24 0 1 1 44 0"/><path d="M32 40 44 24"/><circle cx="32" cy="42" r="4" fill="#f26a1f"/></svg><div class="t">العداد<br><span class="lat" style="font-size:28px" dir="ltr">121 KM</span></div></div>
    <div class="bx"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="5" stroke-linejoin="round"><rect x="6" y="12" width="52" height="46" rx="6"/><path d="M6 24h52M18 6v12M46 6v12"/><g fill="#f26a1f" stroke="none"><rect x="14" y="31" width="8" height="7"/><rect x="28" y="31" width="8" height="7"/><rect x="42" y="31" width="8" height="7"/><rect x="14" y="44" width="8" height="7"/><rect x="28" y="44" width="8" height="7"/></g></svg><div class="t">موديل<br><span class="lat" style="font-size:30px">2022</span></div></div>
  </div>

  <div class="row">
    <div class="price"><div class="tab">السعر</div><span class="n">8,200</span><span class="c">K.D</span></div>
    <div class="sep"></div>
    <div class="phone"><div class="ic"><svg viewBox="0 0 24 24" width="58" height="58" fill="#0d0d0d"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div><div class="n">92257873</div></div>
  </div>
</body>
</html>
