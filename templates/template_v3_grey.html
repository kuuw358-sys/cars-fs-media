<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900;1000&family=Archivo:ital,wght@1,700;1,800&family=Archivo+Black&display=block" rel="stylesheet">
<style>
:root{--o:#f26a1f;--o2:#ff9a4a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Cairo;background:linear-gradient(180deg,#9a9a9a 0%,#7c7c7c 45%,#6a6a6a 100%);color:#fff;position:relative}
.dk{position:absolute;top:0;left:0;width:760px;height:380px;background:linear-gradient(160deg,#2b2b2b,#4a4a4a 70%,rgba(80,80,80,0));clip-path:polygon(0 0,100% 0,62% 100%,0 100%)}
.pw{position:absolute;left:70px;right:70px;top:205px;height:450px;background:url('car_fade.png') center 50%/860px auto no-repeat}
.photo{position:absolute;top:0;bottom:0;left:60px;right:60px;background:url('car_v4c.jpg') center 60%/960px auto no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 82%,transparent 100%)}
.pw2{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}
.ttl{position:absolute;top:44px;left:110px;direction:ltr;line-height:1}
.ttl .a{font-family:'Archivo';font-style:italic;font-weight:800;font-size:66px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.35)}
.ttl .b{font-family:'Archivo';font-style:italic;font-weight:800;font-size:96px;color:#fff;margin-top:4px;text-shadow:0 3px 10px rgba(0,0,0,.35)}
.ttl .c{font-family:'Archivo';font-style:italic;font-weight:800;font-size:30px;letter-spacing:12px;color:var(--o2);margin-top:12px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.slash{position:absolute;top:58px;left:60px;width:8px;height:190px;background:linear-gradient(180deg,var(--o2),var(--o));transform:skewX(-14deg);border-radius:4px;box-shadow:0 0 12px rgba(242,106,31,.6)}
.sale{position:absolute;top:70px;right:60px;width:300px;height:118px;background:linear-gradient(180deg,var(--o2),var(--o) 55%,#d4520c);border-radius:26px;transform:skewX(-14deg);box-shadow:0 12px 28px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.sale span{transform:skewX(14deg);font-weight:1000;font-size:74px;margin-top:-16px}
.cells{position:absolute;top:655px;left:60px;right:60px;height:180px;display:flex}
.cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.cell+.cell::before{content:'';position:absolute;right:0;top:22px;bottom:22px;width:2px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.7),transparent)}
.cell svg{width:72px;height:72px;margin-bottom:4px}
.cell .t{font-weight:800;font-size:38px;line-height:1.15;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.cell .s{font-family:'Archivo';font-style:italic;font-weight:800;font-size:34px}
.bar{position:absolute;top:910px;left:60px;right:60px;height:130px;border-radius:66px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(230,230,230,.75));box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 2px 0 #fff;display:flex;align-items:center;direction:ltr;padding:0 10px}
.bar .ic{width:100px;height:100px;border-radius:50%;background:linear-gradient(180deg,#fff,#e9e9e9);box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;flex:none}
.bar .n{font-family:'Archivo';font-style:italic;font-weight:800;font-size:64px;color:#1c1c1c;margin-left:24px}
.bar .dv{width:2px;height:80px;background:rgba(0,0,0,.25);margin:0 28px}
.pr{position:relative;flex:1;height:110px;border-radius:56px;background:linear-gradient(180deg,var(--o2),var(--o) 55%,#d4520c);box-shadow:0 8px 20px rgba(242,106,31,.45),inset 0 2px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:10px}
.pr .n2{font-family:'Archivo';font-style:italic;font-weight:800;font-size:66px;color:#fff}
.pr .c{font-family:'Archivo';font-style:italic;font-weight:800;font-size:40px;color:#fff;margin-top:12px}
.lbl{position:absolute;top:846px;right:240px;font-weight:900;font-size:40px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}
</style></head><body>
<div class="dk"></div>
<div class="pw"></div>
<div class="slash"></div>
<div class="ttl"><div class="a">Lexus</div><div class="b">UX 200</div><div class="c">F SPORT</div></div>
<div class="sale"><span>للبيع</span></div>
<div class="cells">
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6h22l12 12v40H18z"/><path d="M40 6v12h12"/><path d="M25 32h14M25 42h10"/><path d="M38 50l4 4 8-9"/></svg><div class="t">شرط<br>الفحص</div></div>
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="12"/><path d="M33 33l20 20M45 45l6-6M51 51l4-4"/></svg><div class="t">سيرفس<br>الوكالة</div></div>
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4" stroke-linecap="round"><path d="M10 46a24 24 0 1 1 44 0"/><path d="M32 40 44 24"/><circle cx="32" cy="42" r="4" fill="#f26a1f"/></svg><div class="t">العداد<br><span class="s">92</span> الف كم</div></div>
 <div class="cell"><svg viewBox="0 0 64 64" fill="none" stroke="#f26a1f" stroke-width="4" stroke-linejoin="round"><rect x="6" y="12" width="52" height="46" rx="6"/><path d="M6 24h52M18 6v12M46 6v12"/><g fill="#f26a1f" stroke="none"><rect x="14" y="31" width="8" height="7"/><rect x="28" y="31" width="8" height="7"/><rect x="42" y="31" width="8" height="7"/><rect x="14" y="44" width="8" height="7"/><rect x="28" y="44" width="8" height="7"/></g></svg><div class="t">موديل<br><span class="s">2019</span></div></div>
</div>
<div class="lbl">السعر</div>
<div class="bar">
 <div class="ic"><svg viewBox="0 0 24 24" width="50" height="50" fill="#f26a1f"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div>
 <div class="n">66653231</div><div class="dv"></div>
 <div class="pr"><span class="n2">6,350</span><span class="c">K.D</span></div>
</div>
</body></html>
