<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cairo; src: url(../fonts/cairo-arabic.woff2) format("woff2"); font-weight: 200 1000;
    unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: Cairo; src: url(../fonts/cairo-latin.woff2) format("woff2"); font-weight: 200 1000;
    unicode-range: U+0000-00FF, U+2000-206F; }
  :root { --orange: #ff6a13; --orange2: #ff9a3c; --ink: #141414; --muted: #6b6b6b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body { font-family: Cairo, sans-serif; background: #f4f4f4; position: relative; overflow: hidden; }

  /* orange corner accents */
  .corner { position: absolute; width: 360px; height: 360px; border-radius: 50%; filter: blur(2px); }
  .corner.tl { top: -250px; left: -250px; background: radial-gradient(circle, var(--orange2), var(--orange) 70%); }
  .corner.br { bottom: -260px; right: -260px; background: radial-gradient(circle, var(--orange2), var(--orange) 70%); }

  .frame { position: absolute; inset: 28px; border: 3px solid var(--orange); border-radius: 44px;
    background: #fff; overflow: hidden; display: flex; flex-direction: column; }

  /* ---------- header: title + badge, kept off the photo ---------- */
  .head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 30px 40px 22px; }
  .title { direction: ltr; text-align: left; padding-left: 24px; border-left: 6px solid var(--orange); }
  .title .brand { font-weight: 800; font-size: 40px; line-height: 1; color: var(--ink); }
  .title .model { font-weight: 900; font-size: 76px; line-height: 1; color: var(--ink); letter-spacing: -1px; }
  .title .trim  { font-weight: 800; font-size: 20px; letter-spacing: 11px; color: var(--ink); margin-top: 4px; }
  .badge { padding: 0 44px 12px; background: linear-gradient(135deg, var(--orange2), var(--orange)); color: #fff;
    font-weight: 900; font-size: 60px; border-radius: 28px 28px 28px 6px; box-shadow: 0 10px 24px rgba(255,106,19,.35); }

  /* ---------- photo: whole car always visible, sharp to the bottom ---------- */
  .photo { position: relative; flex: 1; min-height: 0; margin: 0 18px; border-radius: 28px; overflow: hidden; background: #ddd; }
  .photo .bg { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px);
    object-fit: cover; filter: blur(26px) brightness(1.05); }
  .photo .fg { position: relative; width: 100%; height: 100%; object-fit: var(--fit, contain);
    object-position: var(--pos, center); display: block; }

  /* ---------- compact info area ---------- */
  .info { direction: rtl; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 34px;
    padding-top: 6px; padding-bottom: 6px; height: 268px; flex: none; }

  .specs { display: grid; grid-template-columns: repeat(4, 1fr); }
  .spec { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 4px; }
  .spec + .spec { border-right: 2px solid #ffd2b5; }
  .spec svg { width: 34px; height: 34px; flex: none; stroke: var(--orange); fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .spec .t { font-size: 15px; color: var(--muted); font-weight: 700; line-height: 1.1; }
  .spec .v { font-size: 22px; color: var(--ink); font-weight: 800; line-height: 1.15; white-space: nowrap; }

  .bottom { display: flex; gap: 18px; align-items: center; }
  .price { flex: 1; height: 92px; border-radius: 46px; display: flex; align-items: center; justify-content: center; gap: 16px;
    background: linear-gradient(135deg, var(--orange2), var(--orange)); color: #fff; box-shadow: 0 8px 20px rgba(255,106,19,.3); }
  .price .lbl { font-size: 24px; font-weight: 800; background: #fff; color: var(--orange); padding: 0 16px 4px; border-radius: 14px; }
  .price .num { font-size: 50px; font-weight: 900; direction: ltr; }
  .price .cur { font-size: 26px; font-weight: 900; direction: ltr; }
  .phone { flex: 1; height: 92px; border-radius: 46px; background: #f6f6f6; border: 2px solid #eee;
    display: flex; align-items: center; justify-content: center; gap: 16px; direction: ltr; }
  .phone .ic { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--orange2), var(--orange)); }
  .phone .ic svg { width: 30px; height: 30px; fill: #fff; }
  .phone .num { font-size: 46px; font-weight: 900; color: var(--ink); letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="corner tl"></div><div class="corner br"></div>
  <div class="frame">
    <div class="head">
      <div class="title"><div class="brand" data-k="brand"></div><div class="model" data-k="model"></div><div class="trim" data-k="trim"></div></div>
      <div class="badge" data-k="badge"></div>
    </div>
    <div class="photo">
      <img class="bg" id="photoBg" alt="">
      <img class="fg" id="photo" alt="">
    </div>
    <div class="info">
      <div class="specs">
        <div class="spec">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <div><div class="t">موديل</div><div class="v" data-k="year"></div></div>
        </div>
        <div class="spec">
          <svg viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>
          <div><div class="t">العداد</div><div class="v" data-k="mileage"></div></div>
        </div>
        <div class="spec">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="5"/><path d="M11.5 11.5L21 21M17 17l2-2M15 15l2-2"/></svg>
          <div><div class="t">الصيانة</div><div class="v" data-k="service"></div></div>
        </div>
        <div class="spec">
          <svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6z"/><path d="M9 11h7M9 15h4M11 19l2 2 4-4"/></svg>
          <div><div class="t">الفحص</div><div class="v" data-k="inspection"></div></div>
        </div>
      </div>
      <div class="bottom">
        <div class="price"><span class="lbl">السعر</span><span class="num" data-k="price"></span><span class="cur" data-k="currency"></span></div>
        <div class="phone">
          <div class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div>
          <span class="num" data-k="phone"></span>
        </div>
      </div>
    </div>
  </div>
<script>
  window.fill = (d) => {
    document.querySelectorAll('[data-k]').forEach(el => el.textContent = d[el.dataset.k] ?? '');
    // trim (e.g. F SPORT) only shows when it was given
    document.querySelector('.title .trim').style.display = d.trim ? '' : 'none';
    const img = document.getElementById('photo'), bg = document.getElementById('photoBg');
    img.style.setProperty('--pos', d.photoPosition || 'center');
    img.style.setProperty('--fit', d.photoFit || 'contain');   // "cover" fills the box (may crop edges)
    img.src = bg.src = '../' + d.photo;
    // "fit": no blur, no crop - the box shrinks to the photo's own shape (centred)
    if (d.photoFit === 'fit') {
      img.style.setProperty('--fit', 'cover'); bg.style.display = 'none';
      const box = img.parentElement;
      return Promise.all([document.fonts.ready, img.decode()]).then(() => {
        const h = box.clientHeight, w = Math.min(box.clientWidth, Math.round(h * img.naturalWidth / img.naturalHeight));
        box.style.width = w + 'px'; box.style.flex = 'none'; box.style.height = h + 'px';
        box.style.alignSelf = 'center'; box.style.margin = '0 auto';
      });
    }
    return Promise.all([document.fonts.ready, img.decode(), bg.decode()]);
  };
</script>
</body>
</html>
